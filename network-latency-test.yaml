apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: catalog-latency
  namespace: default
spec:
  action: delay             
  mode: all                 
  selector:
    labelSelectors:
      app: productcatalogservice
  delay:
    latency: '2000ms'        
    jitter: '200ms'         
  direction: to             
  duration: '1m'            
